<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Master Ultra</title><style>body{margin:0;overflow:hidden;font-family:Segoe UI;background:radial-gradient(circle at top,#4f46e5,#0f172a);color:#fff}canvas{position:fixed;inset:0}.ui{position:relative;z-index:2;display:flex;justify-content:center;align-items:center;height:100vh}.panel{width:900px;max-width:95%;padding:30px;border-radius:30px;background:rgba(255,255,255,.1);backdrop-filter:blur(20px);box-shadow:0 0 50px rgba(0,0,0,.5);text-align:center}.word{font-size:90px;font-weight:900;text-shadow:0 0 30px currentColor;margin:20px}.score{font-size:28px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:25px}.btn{padding:25px;border:none;border-radius:20px;background:#fff;color:#000;font-size:28px;font-weight:700;cursor:pointer;transition:.25s}.btn:hover{transform:scale(1.05)}#msg{font-size:32px;height:50px;margin:15px}.timer{height:18px;background:#111;border-radius:20px;overflow:hidden;margin-top:10px}.fill{height:100%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444)}</style></head><body><canvas id=c></canvas><div class=ui><div class=panel><h1>🎨 COLOR MASTER ULTRA</h1><div class=score>Score: <span id=s>0</span> | Combo: <span id=combo>0</span></div><div class=timer><div class=fill id=f></div></div><div id=w class=word>RED</div><div id=msg></div><div class=grid id=g></div></div></div><script>const palette=['Red','Blue','Green','Yellow','Purple','Orange'];let answer='',score=0,combo=0,time=60;function snd(freq,d){let a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=freq;o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d/1000);o.stop(a.currentTime+d/1000)}function show(){let word=palette[Math.floor(Math.random()*palette.length)],ink=palette[Math.floor(Math.random()*palette.length)];answer=ink;w.textContent=word;w.style.color=ink.toLowerCase();let choices=[ink];while(choices.length<4){let c=palette[Math.floor(Math.random()*palette.length)];if(!choices.includes(c))choices.push(c)}choices.sort(()=>Math.random()-.5);g.innerHTML='';choices.forEach(c=>{let b=document.createElement('button');b.className='btn';b.textContent=c;b.onclick=()=>check(c);g.appendChild(b)})}function check(c){if(c===answer){score+=10;combo++;msg.innerHTML='✅ Correct!';msg.style.color='#22c55e';snd(900,180)}else{combo=0;msg.innerHTML='❌ Wrong!';msg.style.color='#ef4444';snd(150,350)}s.textContent=score;comboEl.textContent=combo;setTimeout(show,500)}const comboEl=document.getElementById('combo');show();let returnTimer=null;let timeId=setInterval(()=>{time--;f.style.width=(time/60*100)+'%';if(time<=0){clearInterval(timeId);msg.innerHTML='🏆 Game Over! Score: '+score;g.innerHTML='';returnTimer=setTimeout(()=>{window.location.href='../ECC_Roadshow_Premium_Spin_Wheel_Game_Launcher.html'},5000)}},1000);const cv=c,ctx=cv.getContext('2d');function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();onresize=rs;let p=[...Array(150)].map(()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*3+1,s:Math.random()*2+1}));(function an(){ctx.clearRect(0,0,cv.width,cv.height);p.forEach(a=>{ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,6.28);ctx.fill();a.y-=a.s;if(a.y<0)a.y=innerHeight});requestAnimationFrame(an)})()</script></body></html>
