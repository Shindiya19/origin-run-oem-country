<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ECC Picture Phrase Challenge</title>
<style>
:root{--bg1:#07142d;--bg2:#25105b;--cyan:#36e4ff;--gold:#ffc857;--pink:#ff4fa3;--green:#2ee6a6;--red:#ff5f6d;--glass:rgba(255,255,255,.10)}
*{box-sizing:border-box} body{margin:0;min-height:100vh;color:#fff;font-family:Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 15% 10%,#193f85 0,transparent 30%),radial-gradient(circle at 90% 20%,#62268d 0,transparent 35%),linear-gradient(135deg,var(--bg1),var(--bg2));overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle,#fff 1px,transparent 1px);background-size:34px 34px;opacity:.09;animation:stars 18s linear infinite}@keyframes stars{to{transform:translateY(34px)}}
.app{width:min(1180px,94%);margin:28px auto 50px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}.brand h1{margin:0;font-size:clamp(2rem,5vw,4rem);letter-spacing:-2px;text-shadow:0 0 20px rgba(54,228,255,.65)}.brand p{margin:7px 0;color:#cbd8ff}.stats{display:flex;gap:10px;flex-wrap:wrap}.pill{min-width:110px;padding:12px 16px;border:1px solid rgba(255,255,255,.2);border-radius:16px;background:var(--glass);backdrop-filter:blur(14px);box-shadow:0 12px 35px rgba(0,0,0,.23);text-align:center}.pill b{display:block;font-size:1.45rem;color:var(--gold)}
.toolbar{margin:22px 0;display:flex;gap:12px;flex-wrap:wrap}button{border:0;border-radius:13px;padding:13px 20px;font-weight:800;font-size:1rem;color:#07142d;background:linear-gradient(135deg,var(--gold),#ff9f43);cursor:pointer;box-shadow:0 8px 20px rgba(255,174,66,.25);transition:.2s}button:hover{transform:translateY(-2px);filter:brightness(1.08)}button.secondary{color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);box-shadow:none}button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:18px}.card{position:relative;padding:12px;border:1px solid rgba(255,255,255,.16);border-radius:22px;background:var(--glass);backdrop-filter:blur(16px);box-shadow:0 18px 55px rgba(0,0,0,.3);overflow:hidden;transition:.25s}.card:hover{transform:translateY(-5px);border-color:rgba(54,228,255,.7)}.num{position:absolute;z-index:2;top:18px;left:18px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--cyan),#6878ff);box-shadow:0 0 18px rgba(54,228,255,.55)}.picture{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:15px;display:block}.fallback{display:none;width:100%;aspect-ratio:1/1;border-radius:15px;background:linear-gradient(145deg,#182b58,#431f78);place-items:center;text-align:center;padding:20px;font-weight:900;color:#fff}.answer-row{display:flex;gap:8px;margin-top:11px}.answer-row input{min-width:0;flex:1;padding:12px 13px;border-radius:11px;border:1px solid rgba(255,255,255,.22);background:rgba(5,12,35,.7);color:#fff;outline:0;font-size:.95rem}.answer-row input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(54,228,255,.15)}.answer-row button{padding:10px 13px}.feedback{min-height:23px;margin:8px 3px 0;font-weight:800}.card.solved{border-color:var(--green);box-shadow:0 0 28px rgba(46,230,166,.25)}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,5,18,.78);backdrop-filter:blur(8px)}.modal.show{display:flex}.modal-box{width:min(420px,100%);padding:32px;border:1px solid rgba(255,255,255,.22);border-radius:25px;text-align:center;background:linear-gradient(145deg,#172750,#321a64);box-shadow:0 30px 90px rgba(0,0,0,.55);animation:pop .25s ease}.modal-icon{font-size:4rem}.modal h2{font-size:2rem;margin:8px 0}.modal p{color:#d7e1ff}.correct h2{color:var(--green)}.wrong h2{color:var(--red)}@keyframes pop{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}
.confetti{position:fixed;z-index:30;top:-20px;width:10px;height:18px;animation:fall 1.5s linear forwards}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(800deg)}}
.note{margin-top:18px;color:#cbd8ff;font-size:.9rem;text-align:center}@media(max-width:600px){.app{margin-top:18px}.stats{width:100%}.pill{flex:1}.grid{grid-template-columns:1fr}.toolbar button{flex:1}}
</style>
</head>
<body>
<div class="app">
 <div class="top"><div class="brand"><h1>Picture Phrase Challenge</h1><p>Study each picture, enter the phrase and beat the clock.</p></div><div class="stats"><div class="pill">TIME<b id="clock">01:00</b></div><div class="pill">SCORE<b id="score">0 / 5</b></div></div></div>
 <div class="toolbar"><button id="start">Start New Round</button><button id="reveal" class="secondary" disabled>Reveal Answers</button><button id="sound" class="secondary">Sound: ON</button></div>
 <main class="grid" id="grid"></main><p class="note">Keep this HTML file in the same folder as the original JPG picture files.</p>
</div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"><div class="modal-icon" id="modalIcon"></div><h2 id="modalTitle"></h2><p id="modalText"></p><button onclick="closeModal()">Continue</button></div></div>
<script>
const puzzles=[
{image:'01_brain_storm.jpg',answer:'Brainstorm'},{image:'02_skeleton.jpg',answer:'Deadline'},{image:'03_desk_items.jpg',answer:'Remote Work'},{image:'04_balance.jpg',answer:'Work Life Balance'},{image:'05_on_boarding.jpg',answer:'Onboarding'},{image:'06_under_scrutiny.jpg',answer:'Micromanagement'},{image:'08_tongue.jpg',answer:'Tongue Twister'},{image:'09_noon_good.jpg',answer:'Good Afternoon'},{image:'10_fa_st.jpg',answer:'Breakfast'},{image:'12_baked.jpg',answer:'Half-baked'},{image:'13_stance.jpg',answer:'For instance'},{image:'14_secret.jpg',answer:'Top Secret'},{image:'11_on_line.jpg',answer:'Online'}];
let round=[],seconds=60,timer=null,returnTimer=null,score=0,soundOn=true,started=false,roundFinished=false;
const grid=document.getElementById('grid'),clock=document.getElementById('clock'),scoreEl=document.getElementById('score'),reveal=document.getElementById('reveal');
function returnToWheel(){window.location.href='../ECC_Roadshow_Premium_Spin_Wheel_Game_Launcher.html'}
function normalize(s){return s.toLowerCase().replace(/[^a-z0-9]/g,'')}
function tone(freq,duration=.18,type='sine',delay=0){if(!soundOn)return;const C=window.AudioContext||window.webkitAudioContext,ctx=window._ctx||(window._ctx=new C());const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(ctx.destination);const t=ctx.currentTime+delay;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.start(t);o.stop(t+duration)}
function soundCorrect(){tone(520,.15,'sine');tone(760,.22,'sine',.12)}function soundWrong(){tone(190,.25,'sawtooth')}function soundTick(){tone(900,.05,'square')}
function render(){grid.innerHTML=round.map((p,i)=>`<section class="card" id="card${i}"><span class="num">${i+1}</span><img class="picture" src="${p.image}" alt="Picture clue ${i+1}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="fallback">Picture file not found:<br>${p.image}</div><div class="answer-row"><input id="input${i}" autocomplete="off" placeholder="Enter your answer" onkeydown="if(event.key==='Enter')check(${i})"><button onclick="check(${i})">✓</button></div><div class="feedback" id="feed${i}"></div></section>`).join('')}
function startRound(){clearInterval(timer);clearTimeout(returnTimer);roundFinished=false;round=[...puzzles].sort(()=>Math.random()-.5).slice(0,5).map(p=>({...p,solved:false}));score=0;seconds=60;started=true;scoreEl.textContent='0 / 5';clock.textContent='01:00';reveal.disabled=false;render();timer=setInterval(()=>{seconds--;clock.textContent='00:'+String(seconds).padStart(2,'0');if(seconds<=10&&seconds>0)soundTick();if(seconds<=0)finishRound(false,'Time is up!','Reveal the answers or start a new round.','⏰')},1000)}
function check(i){if(!started)return showModal(false,'Round not started','Select Start New Round first.','🎮');const p=round[i],input=document.getElementById('input'+i);if(p.solved)return;if(normalize(input.value)===normalize(p.answer)){p.solved=true;score++;scoreEl.textContent=score+' / 5';document.getElementById('card'+i).classList.add('solved');document.getElementById('feed'+i).textContent='✓ Correct';input.disabled=true;soundCorrect();confetti();showModal(true,'Correct!','Great answer. Keep going!','✅');if(score===5)finishRound(true,'Perfect Round!','You solved all five picture phrases.','🏆')}else{soundWrong();showModal(false,'Not Correct','Try again and look closely at the picture clue.','❌')}}
function finishRound(ok,title,text,icon){clearInterval(timer);started=false;roundFinished=true;showModal(ok,title,text,icon);returnTimer=setTimeout(returnToWheel,5000)}
function showModal(ok,title,text,icon){const m=document.getElementById('modal'),b=document.getElementById('modalBox');b.className='modal-box '+(ok?'correct':'wrong');document.getElementById('modalIcon').textContent=icon;document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=text;m.classList.add('show')}
function closeModal(){if(roundFinished){returnToWheel();return}document.getElementById('modal').classList.remove('show')}
function confetti(){const colors=['#36e4ff','#ffc857','#ff4fa3','#2ee6a6','#fff'];for(let i=0;i<45;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=colors[i%colors.length];c.style.setProperty('--x',(Math.random()*300-150)+'px');c.style.animationDelay=Math.random()*.25+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),1900)}}
document.getElementById('start').onclick=startRound;reveal.onclick=()=>{round.forEach((p,i)=>{document.getElementById('feed'+i).textContent='Answer: '+p.answer});};document.getElementById('sound').onclick=function(){soundOn=!soundOn;this.textContent='Sound: '+(soundOn?'ON':'OFF');if(soundOn)tone(620)};document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
render();
</script>
</body></html>
