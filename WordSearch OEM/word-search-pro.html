<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071b2c" />
  <title>OEM Word Search Pro</title>
  <style>
    :root{
      --bg:#061421;--panel:#0b2235;--panel2:#102b42;--ink:#f4fbff;--muted:#9cb6c8;
      --cyan:#31d7ff;--green:#37e38b;--red:#ff5572;--gold:#ffd45d;--line:rgba(255,255,255,.1);
      --shadow:0 22px 70px rgba(0,0,0,.35)
    }
    *{box-sizing:border-box} html,body{height:100%;margin:0}
    body{overflow:hidden;background:radial-gradient(circle at 15% 10%,#123a59 0,transparent 36%),radial-gradient(circle at 85% 90%,#102f44 0,transparent 34%),var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif}
    button{font:inherit}
    .app{height:100dvh;display:grid;grid-template-rows:auto 1fr;padding:clamp(10px,1.4vw,22px);gap:clamp(10px,1.2vw,18px)}
    header{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px}
    .brand h1{margin:0;font-size:clamp(1.35rem,2.4vw,2.35rem);letter-spacing:-.04em}.brand p{margin:.25rem 0 0;color:var(--muted);font-size:clamp(.78rem,1vw,.98rem)}
    .hud{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .stat{min-width:92px;padding:9px 13px;border:1px solid var(--line);border-radius:14px;background:rgba(11,34,53,.83);box-shadow:0 8px 24px rgba(0,0,0,.18)}
    .stat label{display:block;color:var(--muted);font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.stat strong{font-size:1.12rem;font-variant-numeric:tabular-nums}
    #time.warning strong{color:var(--red);animation:pulse .7s infinite alternate}
    .icon-btn,.start-btn{border:0;border-radius:13px;color:var(--ink);cursor:pointer;font-weight:800;transition:.18s transform,.18s filter}
    .icon-btn{width:44px;height:44px;background:var(--panel2);border:1px solid var(--line);font-size:1.1rem}.start-btn{padding:0 18px;height:44px;background:linear-gradient(135deg,#18b9f1,#2f7cff);box-shadow:0 10px 25px rgba(30,146,255,.28)}
    button:hover{filter:brightness(1.1);transform:translateY(-1px)}button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
    .game{min-height:0;display:grid;grid-template-columns:minmax(180px,25vw) minmax(0,1fr);gap:clamp(10px,1.3vw,20px)}
    .sidebar,.board-card{border:1px solid var(--line);background:linear-gradient(160deg,rgba(16,43,66,.94),rgba(7,26,41,.94));border-radius:22px;box-shadow:var(--shadow);min-height:0}
    .sidebar{padding:clamp(14px,1.4vw,22px);display:flex;flex-direction:column}.sidebar h2{margin:0 0 4px;font-size:1rem}.hint{margin:0 0 13px;color:var(--muted);font-size:.75rem;line-height:1.4}
    .word-bank{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;overflow:auto;padding-right:3px}
    .word{border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:rgba(255,255,255,.045);font-weight:800;font-size:clamp(.7rem,.9vw,.85rem);letter-spacing:.04em;transition:.22s}
    .word.got{color:#06351f;background:var(--green);border-color:var(--green);text-decoration:line-through;box-shadow:0 0 22px rgba(55,227,139,.35)}
    .legend{margin-top:auto;padding-top:12px;color:var(--muted);font-size:.68rem;line-height:1.5}
    .board-card{position:relative;display:grid;place-items:center;padding:clamp(8px,1.3vw,18px);overflow:hidden;container-type:size}
    .board{width:min(100cqw,100cqh);aspect-ratio:1;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));grid-template-rows:repeat(14,minmax(0,1fr));gap:clamp(2px,.35vw,5px);touch-action:none;user-select:none}
    .cell{display:grid;place-items:center;border:1px solid rgba(255,255,255,.08);border-radius:clamp(4px,.55vw,9px);background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));font-weight:900;font-size:clamp(.62rem,1.45vw,1.28rem);cursor:crosshair;transition:.12s transform,.16s background,.16s color,.16s box-shadow}
    .cell:hover{transform:scale(1.06);border-color:rgba(49,215,255,.55)}.cell.selected{color:#061421;background:var(--gold);box-shadow:0 0 14px rgba(255,212,93,.45)}
    .cell.correct{color:#042c1a;background:var(--green);box-shadow:0 0 16px rgba(55,227,139,.55)}.cell.wrong{color:white;background:var(--red);box-shadow:0 0 18px rgba(255,85,114,.6);animation:shake .23s linear 2}
    .toast{position:absolute;left:50%;bottom:20px;transform:translate(-50%,18px);opacity:0;pointer-events:none;padding:10px 16px;border-radius:999px;background:#071520;border:1px solid var(--line);font-weight:800;box-shadow:var(--shadow);transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}
    .modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:rgba(2,10,18,.78);backdrop-filter:blur(12px)}.modal.open{display:grid}
    .modal-card{width:min(92vw,520px);padding:34px;border:1px solid rgba(255,255,255,.15);border-radius:26px;text-align:center;background:linear-gradient(155deg,#123751,#091c2c);box-shadow:0 30px 100px rgba(0,0,0,.55);animation:pop .3s ease}
    .modal-icon{font-size:3.5rem}.modal h2{margin:10px 0 5px;font-size:2rem}.modal p{margin:0;color:var(--muted)}.final-score{margin:20px 0;font-size:1.35rem}.final-score strong{color:var(--gold);font-size:2rem}.modal button{width:100%;height:48px;border:0;border-radius:14px;color:white;background:linear-gradient(135deg,#18b9f1,#2f7cff);font-weight:900;cursor:pointer}
    #confetti{position:fixed;inset:0;z-index:25;pointer-events:none}
    @keyframes pulse{to{transform:scale(1.08)}}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
    @media(max-width:760px){body{overflow:auto}.app{height:auto;min-height:100dvh}.game{grid-template-columns:1fr}.sidebar{order:2}.board-card{order:1;container-type:normal}.board{width:min(100%,88dvh)}.legend{display:none}.hud .stat{min-width:72px;padding:7px 9px}.brand p{display:none}}
    @media(max-width:560px){header{grid-template-columns:1fr}.hud{justify-content:flex-start}}
    @media(max-width:460px){.app{padding:8px}.brand h1{font-size:1.12rem}.start-btn{padding:0 12px}.icon-btn{width:40px}.stat{min-width:62px}.stat label{font-size:.55rem}.stat strong{font-size:.92rem}.board{gap:2px}.cell{border-radius:4px;font-size:clamp(.55rem,3.4vw,.92rem)}.sidebar{padding:13px}.word-bank{grid-template-columns:repeat(2,1fr)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="app">
  <header>
    <div class="brand"><h1>OEM Word Search Pro</h1><p>Drag in any straight direction. Find every manufacturer before time runs out.</p></div>
    <div class="hud">
      <div class="stat"><label>Points</label><strong id="score">0</strong></div>
      <div class="stat" id="time"><label>Time</label><strong id="clock">01:00</strong></div>
      <button class="icon-btn" id="sound" aria-label="Toggle sound" title="Toggle sound">🔊</button>
      <button class="start-btn" id="start">Start Game</button>
    </div>
  </header>
  <main class="game">
    <aside class="sidebar"><h2>Words to find</h2><p class="hint">Complete all 10 words. Correct selections score points. Wrong selections show in red.</p><div class="word-bank" id="wordBank"></div><div class="legend">✓ Correct: +100 points + time bonus<br>✕ Wrong: −15 points</div></aside>
    <section class="board-card"><div class="board" id="board" aria-label="OEM word search grid"></div><div class="toast" id="toast" role="status"></div></section>
  </main>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-card"><div class="modal-icon" id="modalIcon">🏁</div><h2 id="modalTitle">Game Over</h2><p id="modalText"></p><div class="final-score">Points: <strong id="finalScore">0</strong></div><button id="playAgain">Back to wheel</button></div></div>
<script>
const rows=["DAIMLERHPYZDVQ","CUMMINSSOCEEYV","HHJVUNNIKOLASG","NOXERQGWODHZUU","SZJNNAVISTARSF","HBCLRBESFUNTET","WSBLDEUTZDZCUC","HPLHFORDOTOSAN","EMANKPBROHTGNC","LNPMVNBSKLAPRY","JCBRVGMATITKOL","NZHTTDEJSUDVDE","UOMZKNXHATZXWY","KYBNZCFFPTFTZY"];
const words=[{label:"DAIMLER",word:"DAIMLER"},{label:"CUMMINS",word:"CUMMINS"},{label:"NIKOLA",word:"NIKOLA"},{label:"NAVISTAR",word:"NAVISTAR"},{label:"DEUTZ",word:"DEUTZ"},{label:"FORD OTOSAN",word:"FORDOTOSAN"},{label:"MAN",word:"MAN"},{label:"HATZ",word:"HATZ"},{label:"JCB",word:"JCB"},{label:"FPT",word:"FPT"}];
const board=document.querySelector("#board"),bank=document.querySelector("#wordBank"),scoreEl=document.querySelector("#score"),clock=document.querySelector("#clock"),timeBox=document.querySelector("#time"),toast=document.querySelector("#toast"),modal=document.querySelector("#modal");
let found=new Set(),foundCells=new Set(),drag=null,locked=true,score=0,seconds=60,timerId=null,soundOn=true,audio=null;
function returnToWheel(){window.location.href="../ECC_Roadshow_Premium_Spin_Wheel_Game_Launcher.html"}
function audioCtx(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();return audio}
function tone(type){if(!soundOn)return;const a=audioCtx(),now=a.currentTime,notes=type==="good"?[523,659,784]:type==="win"?[523,659,784,1047]:type==="bad"?[180,130]:[110,85];notes.forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type=type==="bad"?"sawtooth":"sine";o.frequency.setValueAtTime(f,now+i*.09);g.gain.setValueAtTime(.0001,now+i*.09);g.gain.exponentialRampToValueAtTime(.18,now+i*.09+.015);g.gain.exponentialRampToValueAtTime(.0001,now+i*.09+.18);o.connect(g).connect(a.destination);o.start(now+i*.09);o.stop(now+i*.09+.2)})}
function renderBank(){bank.innerHTML=words.map(w=>`<div class="word ${found.has(w.word)?"got":""}">${found.has(w.word)?"✓ ":""}${w.label}</div>`).join("")}
function cell(r,c){return board.children[r*14+c]}
function build(){board.innerHTML="";rows.forEach((row,r)=>[...row].forEach((ch,c)=>{const el=document.createElement("div");el.className="cell";el.textContent=ch;el.dataset.r=r;el.dataset.c=c;if(foundCells.has(`${r},${c}`))el.classList.add("correct");el.onpointerdown=e=>{e.preventDefault();if(locked)return;drag={r,c,cells:[[r,c]]};paint()};el.onpointerenter=()=>{if(!drag||locked)return;const line=lineCells(drag.r,drag.c,r,c);if(line){drag.cells=line;paint()}};board.appendChild(el)}))}
function lineCells(r1,c1,r2,c2){const dr=Math.sign(r2-r1),dc=Math.sign(c2-c1),a=Math.abs(r2-r1),b=Math.abs(c2-c1);if(!(r1===r2||c1===c2||a===b))return null;return Array.from({length:Math.max(a,b)+1},(_,i)=>[r1+dr*i,c1+dc*i])}
function paint(){board.querySelectorAll(".selected").forEach(x=>x.classList.remove("selected"));drag.cells.forEach(([r,c])=>cell(r,c).classList.add("selected"))}
function say(msg,bad=false){toast.textContent=msg;toast.style.color=bad?"var(--red)":"var(--green)";toast.classList.add("show");clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove("show"),1200)}
function endDrag(){if(!drag||locked){drag=null;return}const seq=drag.cells.map(([r,c])=>rows[r][c]).join(""),rev=[...seq].reverse().join(""),match=words.find(w=>w.word===seq||w.word===rev);board.querySelectorAll(".selected").forEach(x=>x.classList.remove("selected"));if(match&&!found.has(match.word)){found.add(match.word);drag.cells.forEach(([r,c])=>{foundCells.add(`${r},${c}`);cell(r,c).classList.add("correct")});const gain=100+seconds;score+=gain;scoreEl.textContent=score;renderBank();tone("good");say(`Excellent! +${gain} points`);if(found.size===words.length)finish(true)}else{const active=drag.cells.filter(([r,c])=>!foundCells.has(`${r},${c}`));active.forEach(([r,c])=>cell(r,c).classList.add("wrong"));setTimeout(()=>active.forEach(([r,c])=>cell(r,c).classList.remove("wrong")),550);score=Math.max(0,score-15);scoreEl.textContent=score;tone("bad");say(match?"Already found":"Not a word. −15 points",true)}drag=null}
function start(){clearInterval(timerId);drag=null;found.clear();foundCells.clear();score=0;seconds=60;locked=false;scoreEl.textContent="0";clock.textContent="01:00";timeBox.classList.remove("warning");modal.classList.remove("open");renderBank();build();tone("good");document.querySelector("#start").textContent="Restart";timerId=setInterval(()=>{seconds--;clock.textContent=`${String(Math.floor(seconds/60)).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}`;timeBox.classList.toggle("warning",seconds<=15);if(seconds<=0)finish(false)},1000)}
function finish(won){clearInterval(timerId);locked=true;if(won){score+=seconds*10;scoreEl.textContent=score;tone("win");if(score>=1000)confetti()}else tone("time");document.querySelector("#modalIcon").textContent=won?(score>=1000?"🏆":"⭐"):"⏰";document.querySelector("#modalTitle").textContent=won?"Game Over: You Won!":"Time Up: Game Over";document.querySelector("#modalText").textContent=won?`You found all ${words.length} words.${score>=1000?" Outstanding score!":" Great effort!"}`:`You found ${found.size} of ${words.length} words.`;document.querySelector("#finalScore").textContent=score;modal.classList.add("open")}
function confetti(){const cvs=document.querySelector("#confetti"),ctx=cvs.getContext("2d");cvs.width=innerWidth;cvs.height=innerHeight;const colors=["#31d7ff","#37e38b","#ffd45d","#ff5572","#ffffff"],bits=Array.from({length:170},()=>({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*.4,vx:(Math.random()-.5)*6,vy:2+Math.random()*5,s:4+Math.random()*7,c:colors[Math.floor(Math.random()*colors.length)],r:Math.random()*6}));let f=0;(function draw(){ctx.clearRect(0,0,cvs.width,cvs.height);bits.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.15;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.55);ctx.restore()});if(f++<210)requestAnimationFrame(draw);else ctx.clearRect(0,0,cvs.width,cvs.height)})()}
document.addEventListener("pointerup",endDrag);document.querySelector("#start").onclick=start;document.querySelector("#playAgain").onclick=()=>returnToWheel(0);document.querySelector("#sound").onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?"🔊":"🔇"};window.addEventListener("resize",()=>{const c=document.querySelector("#confetti");c.width=innerWidth;c.height=innerHeight});build();renderBank();
</script>
</body>
</html>
